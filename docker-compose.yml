services:
  gyopart-api:
    image: dwilson2547/gyopart-api:${GYOPART_TAG:-latest}
    build:
      context: ./gyopart-api
      dockerfile: Dockerfile

  gyopart-ui:
    image: dwilson2547/gyopart-ui:${GYOPART_TAG:-latest}
    build:
      context: ./gyopart-ui
      dockerfile: Dockerfile

  inventory-api:
    image: dwilson2547/inventory-api:${GYOPART_TAG:-latest}
    build:
      context: ./junkyard-platform
      dockerfile: Dockerfile.inventory-api

  admin-api:
    image: dwilson2547/admin-api:${GYOPART_TAG:-latest}
    build:
      context: ./junkyard-platform
      dockerfile: Dockerfile.admin-api

  vin-resolver:
    image: dwilson2547/vin-resolver:${GYOPART_TAG:-latest}
    build:
      context: ./junkyard-platform
      dockerfile: Dockerfile.vin-resolver

  # Junkyard inventory scrapers — one image per yard company, run by scrape-job-manager
  # (Scraper/ScrapeJob resources in helm/gyopart). Build context is the scrapers root so each
  # image can include scrape_contract.py.
  scraper-parts-galore:
    image: dwilson2547/gyopart-scraper-parts-galore:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: parts-galore/Dockerfile

  scraper-pic-n-pull:
    image: dwilson2547/gyopart-scraper-pic-n-pull:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: pic-n-pull/Dockerfile

  scraper-ryans-pic-a-part:
    image: dwilson2547/gyopart-scraper-ryans-pic-a-part:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: ryans_pic_a_part/Dockerfile

  scraper-us-auto-supply:
    image: dwilson2547/gyopart-scraper-us-auto-supply:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: us_auto_parts_sterling_heights/Dockerfile

  # Parts-direct update scraper v2 (parts-interchange/parts-direct/update-scraper/docs/design-v2.md):
  # one shared image for every manufacturer site; run by scrape-job-manager, browser via browserless.
  scraper-pull-a-part:
    image: dwilson2547/gyopart-scraper-pull-a-part:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: pull_a_part_scraper/Dockerfile
  scraper-speedway-ap:
    image: dwilson2547/gyopart-scraper-speedway-ap:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: speedwayap/Dockerfile
  scraper-arizona-auto-parts:
    image: dwilson2547/gyopart-scraper-arizona-auto-parts:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: arizonaautoparts/Dockerfile
  scraper-las-parts:
    image: dwilson2547/gyopart-scraper-las-parts:latest
    build:
      context: ./junkyard-inventory-scrapers
      dockerfile: las-parts/Dockerfile
  scraper-stricker-auto-parts:
    image: dwilson2547/gyopart-scraper-stricker-auto-parts:latest

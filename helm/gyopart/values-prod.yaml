# gyopart prod (Argo app `gyopart`: main, values.yaml + this file). Only what differs from values.yaml.

# Scraper fleet run by scrape-job-manager (templates/scrapers.yaml): the parts-direct updater.
scraping:
  enabled: true
  # Images are pinned by digest (scripts/pin-scraper-images.sh helm/gyopart/values-prod.yaml after each push).
  imagePullPolicy: IfNotPresent
  webcacheUrl: http://webcache.scrape-stack.svc.cluster.local:8000
  imgcacheUrl: http://imgcache.scrape-stack.svc.cluster.local:8010
  requestAuthServer: request-auth-server.scrape-stack.svc.cluster.local:9000

  pools:
    # Parts catalogue updater (parts-interchange/parts-direct/update-scraper/docs/design-v2.md). Daily,
    # but a run with nothing to do exits before touching the site: in practice each site is visited for
    # monthly discovery (new vehicles) and while it has a backlog.
    parts-direct:
      every: 1d
      activeHours:
        tz: America/New_York
        hours: "06:00-23:00"
    # Yards whose whole inventory is one cheap request: daily, so a car shows up the day after it
    # lands (US Auto Supply's feed refreshes around 01:30).
    junkyard-daily:
      every: 1d
      activeHours:
        tz: America/New_York
        hours: "06:00-22:00"
    # Every other yard: weekly, weekday business hours, balanced across the week.
    junkyard-inventory:
      every: 1w
      activeHours:
        tz: America/New_York
        days: [Mon, Tue, Wed, Thu, Fri]
        hours: "09:00-19:00"

  defaults:
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 512Mi}
    policy:
      concurrency: 1
      spacing: {min: 10m, jitter: 15m}
      retry: {attempts: 3, backoff: {initial: 5m, factor: 3, max: 2h}}
      suspendAfter: 3

  scrapers:
    # One image for every manufacturer site, one job per site. Runs are capped at 3h (SCRAPE_DEADLINE
    # lands ~10 min before) so 4 at a time rotate through every site with work in the 17h window.
    # Browser: its own browserless sidecar (headed, scraping.browserSidecar); site traffic goes through the VPN proxy.
    parts-direct:
      image: dwilson2547/gyopart-scraper-parts-direct@sha256:23688a3d800cdb4246f8c0fb25055794ba3924a44c0a9c7fd8add96b6802e403
      database: parts-interchange
      browserSidecar: true
      timeout: 3h
      health: {minItems: 0, maxDropPct: 100}
      policy:
        concurrency: 4
        spacing: {min: 2m, jitter: 3m}
        retry: {attempts: 3, backoff: {initial: 15m, factor: 2, max: 1h}}
      env:
        - {name: VPN_PROXY_URL, value: "http://nordvpn-proxy-entrypoint.vpn.svc.cluster.local:8118"}
        - {name: NO_PROXY, value: ".svc.cluster.local,.cluster.local,localhost,127.0.0.1"}
        - {name: BROWSERLESS_URL, value: "ws://localhost:3000/chromium"}
      resources:
        requests: {cpu: 250m, memory: 512Mi}
        limits: {memory: 1Gi}
      jobs:
        # Mopar (the full catalogue lives on the 'fiat' site): backlog of never-filled vehicles, refresh on.
        parts-direct-mopar: {pool: parts-direct, params: {config: fiat, discovery_interval_days: 30}}
        # Every other site changes rarely (user, 2026-10-11): new vehicles only, looked for monthly.
        # Not yet: audi, acura, porsche (moved to oempartsonline.com; picker 403), vw (redirects to a
        # dealer site), mazda (Cloudflare never clears from the VPN), suzuki (expired certificate).
        parts-direct-bmw: {pool: parts-direct, params: {config: bmw, refresh: false, discovery_interval_days: 30}}
        parts-direct-ford: {pool: parts-direct, params: {config: ford, refresh: false, discovery_interval_days: 30}}
        parts-direct-gm: {pool: parts-direct, params: {config: gm, refresh: false, discovery_interval_days: 30}}
        parts-direct-honda: {pool: parts-direct, params: {config: honda, refresh: false, discovery_interval_days: 30}}
        parts-direct-hyundai: {pool: parts-direct, params: {config: hyundai, refresh: false, discovery_interval_days: 30}}
        parts-direct-infiniti: {pool: parts-direct, params: {config: infiniti, refresh: false, discovery_interval_days: 30}}
        parts-direct-jaguar: {pool: parts-direct, params: {config: jaguar, refresh: false, discovery_interval_days: 30}}
        parts-direct-kia: {pool: parts-direct, params: {config: kia, refresh: false, discovery_interval_days: 30}}
        parts-direct-mercedes: {pool: parts-direct, params: {config: mercedes, refresh: false, discovery_interval_days: 30}}
        parts-direct-mini: {pool: parts-direct, params: {config: mini, refresh: false, discovery_interval_days: 30}}
        parts-direct-mitsubishi: {pool: parts-direct, params: {config: mitsubishi, refresh: false, discovery_interval_days: 30}}
        parts-direct-nissan: {pool: parts-direct, params: {config: nissan, refresh: false, discovery_interval_days: 30}}
        parts-direct-subaru: {pool: parts-direct, params: {config: subaru, refresh: false, discovery_interval_days: 30}}
        parts-direct-toyota: {pool: parts-direct, params: {config: toyota, refresh: false, discovery_interval_days: 30}}
        parts-direct-volvo: {pool: parts-direct, params: {config: volvo, refresh: false, discovery_interval_days: 30}}
    # US Auto Supply, Sterling Heights MI: one GET of the yard's CrushYMS XML feed (full inventory).
    us-auto-supply:
      image: dwilson2547/gyopart-scraper-us-auto-supply@sha256:f285dde7d5f6041ded1b493b3b4fdf2477950986c0de87acc864a527c7346179
      timeout: 15m
      jobs:
        us-auto-supply: {pool: junkyard-daily}
    parts-galore:
      image: dwilson2547/gyopart-scraper-parts-galore@sha256:2145d9f961df853b990d74c247d0698dbce1fb0d2418289d59a3a36c3bb82ae0
      timeout: 30m
      jobs:
        parts-galore: {pool: junkyard-inventory}
    pic-n-pull:
      image: dwilson2547/gyopart-scraper-pic-n-pull@sha256:ff6eb876d1d71e3cab09ad1b13c17f7ed17ff3035d5416ee2a6732b519c02f89
      timeout: 2h
      jobs:
        pic-n-pull: {pool: junkyard-inventory}   # one job: the scraper loops every location
    ryans-pic-a-part:
      image: dwilson2547/gyopart-scraper-ryans-pic-a-part@sha256:48be126c6408c2d4d7da88cb97656da0e4e726cd8a4a41be53a604cb5132d2c3
      timeout: 1h
      # Feed is recent arrivals only, so weekly counts swing naturally: keep the zero check,
      # skip drop detection (100% = never).
      health: {maxDropPct: 100}
      resources:
        requests: {cpu: 500m, memory: 1Gi}
        limits: {memory: 2Gi}
      jobs:
        ryans-pic-a-part: {pool: junkyard-inventory}
    # Wrench A Part, 7 Texas yards in one job.
    wrenchapart:
      image: dwilson2547/gyopart-scraper-wrenchapart@sha256:dd0e2091e85138366fbdc16d64bdeb458390fd83ab26282d764f8cf1a89eea97
      timeout: 1h
      jobs:
        wrenchapart: {pool: junkyard-inventory}
    picknpull-sa:
      image: dwilson2547/gyopart-scraper-picknpull-sa@sha256:910447fb4601118daf2b58002fc116524fceeabac3759dadafd2f5401f6b30c3
      timeout: 30m
      jobs:
        picknpull-sa: {pool: junkyard-inventory}
    # iPull-uPull, 4 California yards.
    ipullupull:
      image: dwilson2547/gyopart-scraper-ipullupull@sha256:f0b6cb32a561e1b8420723a1e06c5661db5f1f030c350f7dbc6513975cd668fa
      timeout: 1h
      jobs:
        ipullupull: {pool: junkyard-inventory}
    # Lentini, NJ. Incremental after the first crawl (new arrivals only).
    las-parts:
      image: dwilson2547/gyopart-scraper-las-parts@sha256:c51fdbb697865601b1e7ae74066f71cc439631900d97af488932687b34818451
      timeout: 3h  # first prod crawl is uncached: ~650 pages at prod's request rate
      # Incremental runs report only new vehicles (often 0): no zero or drop checks.
      health: {minItems: 0, maxDropPct: 100}
      jobs:
        las-parts: {pool: junkyard-inventory}
    # Skips the full crawl when every new arrival is already known.
    budget-upullit:
      image: dwilson2547/gyopart-scraper-budget-upullit@sha256:b10471884400d375ee6fbf550809b3e282b7e1f22965b006e35c3e783fed1713
      timeout: 1h
      # Incremental runs report only new vehicles (often 0): no zero or drop checks.
      health: {minItems: 0, maxDropPct: 100}
      jobs:
        budget-upullit: {pool: junkyard-inventory}
    central-florida-pick-and-pay:
      image: dwilson2547/gyopart-scraper-central-florida-pick-and-pay@sha256:ed2452deb19a3a18d6c617623884cf75cf80b4ac8c0b539340d2fc49929f053d
      timeout: 30m
      jobs:
        central-florida-pick-and-pay: {pool: junkyard-inventory}
    used-auto-parts-fl:
      image: dwilson2547/gyopart-scraper-used-auto-parts-fl@sha256:90bf1639bedee6b95bfca497f094191402be9cbb586da06f493213921a844a67
      timeout: 1h
      jobs:
        used-auto-parts-fl: {pool: junkyard-inventory}
    # Arizona Auto Parts, Phoenix + Tucson. Incremental after the first crawl (new arrivals only).
    arizona-auto-parts:
      image: dwilson2547/gyopart-scraper-arizona-auto-parts@sha256:102c12d35fefe95933af4dafd9d3a553364622850e043c1fcbf16eb7dde97fec
      timeout: 3h  # first prod crawl is uncached: ~650 pages at prod's request rate
      # Incremental runs report only new vehicles (often 0): no zero or drop checks.
      health: {minItems: 0, maxDropPct: 100}
      jobs:
        arizona-auto-parts: {pool: junkyard-inventory}
    # Pull-N-Save, 8 yards (AZ/UT/CA): one POST per store x make. Riverside has no address yet (not geocoded).
    pull-n-save:
      image: dwilson2547/gyopart-scraper-pull-n-save@sha256:461af6d0ecab2688fde6604778f1e53266749a6ae8c81bb89c4877c93129e884
      timeout: 3h
      jobs:
        pull-n-save: {pool: junkyard-inventory}
    # Fenix U-Pull, 4 yards (NY/GA): location x make x model (~1,940 requests on a full crawl). Skips the
    # full crawl when every recent arrival is already known, reporting the known total.
    fenix-upull:
      image: dwilson2547/gyopart-scraper-fenix-upull@sha256:d87d42fabd5f75dd1743c44e237bfc9f9cce831a6cf7e6a4ad1ae923a795440e
      timeout: 4h
      jobs:
        fenix-upull: {pool: junkyard-inventory}
    speedway-ap:
      image: dwilson2547/gyopart-scraper-speedway-ap@sha256:5dac55a81b369e06a8221e91f61cc30112aef6a635a6d3db1afc70041cde3211
      timeout: 3h
      health: {minItems: 0, maxDropPct: 100}
      jobs:
        speedway-ap: {pool: junkyard-inventory}
    stricker-auto-parts:
      image: dwilson2547/gyopart-scraper-stricker-auto-parts@sha256:e54a0cead0648f09df66523ab185e3668ac25c0f147e7d29771ec38b31549b43
      timeout: 3h
      health: {minItems: 0, maxDropPct: 100}
      jobs:
        stricker-auto-parts: {pool: junkyard-inventory}
    utpap:
      image: dwilson2547/gyopart-scraper-utpap@sha256:9a42b64ac4c6e015bdd52fc666622f31faeeb3145e8baf3fa3e0d2b1af8a979c
      timeout: 1h
      jobs:
        utpap: {pool: junkyard-inventory}
    tear-a-part:
      image: dwilson2547/gyopart-scraper-tear-a-part@sha256:99f067199e2f8a8d10d3f69b762840a964093b07c01a8bf75ab94da7d1197a05
      timeout: 1h
      jobs:
        tear-a-part: {pool: junkyard-inventory}
    pull-a-part:
      image: dwilson2547/gyopart-scraper-pull-a-part@sha256:6be20cf0f5264dfeaad18911e7658ba7b428aeb42852bc85a8698ecaf84d8906
      timeout: 4h
      jobs:
        pull-a-part: {pool: junkyard-inventory}

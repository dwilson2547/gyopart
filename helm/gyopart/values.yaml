namespace:
  create: true
  name: gyopart

domain: gyopart.local

images:
  # Released versions (git tags v3.0.2; gyopart-ui v3.0.7): built from a clean clone with GYOPART_TAG=<v> docker compose build/push.
  # A new release goes into values-dev.yaml first and moves here once proven in dev.
  gyopartApi: dwilson2547/gyopart-api:3.0.2
  gyopartUi: dwilson2547/gyopart-ui:3.0.7
  inventoryApi: dwilson2547/inventory-api:3.0.2
  adminApi: dwilson2547/admin-api:latest
  vinResolver: dwilson2547/vin-resolver:latest

imagePullPolicy: Always

postgres:
  host: postgres.postgres.svc.cluster.local
  junkyardSecret: junkyard-credentials
  partsSecret: parts-interchange-credentials

ingress:
  enabled: true
  className: nginx

# Admin sign-in (junkyard-platform/admin_api/auth): authentik OIDC, who may sign in = authentik group
# gyopart-admin. Empty issuer = no sign-in (LAN only). Secret keys: OIDC_CLIENT_ID, OIDC_CLIENT_SECRET.
adminAuth:
  issuer: ""
  secret: ""

# Public admin host (templates/admin-public-ingress.yaml); refused without adminAuth.issuer. One level under
# danwils.com (gyopart-admin.danwils.com): Cloudflare's free certificate doesn't cover deeper names.
adminPublicIngress:
  host: ""
  tlsSecretName: ""

# Public site (templates/public-ingress.yaml): the UI on a *.danwils.com host via
# Traefik pubsecure. Empty host = LAN only. Set per environment (values-prod.yaml).
publicIngress:
  host: ""
  tlsSecretName: ""
  # Stricter per-visitor limit on /v1/vin/ (each decode is an NHTSA call).
  vinRateLimit:
    average: 12
    period: 1m
    burst: 10

monitoring:
  otelCollector:
    httpEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4318"
    grpcEndpoint: "otel-collector.monitoring.svc.cluster.local:4317"

# Live VIN resolver worker (templates/vin-resolver.yaml). Needs junkyard migration 0004 applied first.
vinResolver:
  enabled: true


# Scraper fleet run by scrape-job-manager (templates/scrapers.yaml). Off by default: Helm layers every
# environment's values file over this one and merges maps, so jobs defined here would also run in dev.
# Prod's fleet is in values-prod.yaml; dev's in values-dev.yaml.
scraping:
  enabled: false
  # Per-run browser for scrapers that drive a browser for the whole run (`browserSidecar: true`):
  # a native sidecar on localhost:3000, so each run's Chrome lands on whichever node the scheduler
  # picks and is bounded by its own memory limit. One shared browserless pod held every session on
  # one node and a single tab reached 6.8 GB (2026-10-13). Scrapers that only need a browser for a
  # token keep using scrape-stack's shared browserless.
  browserSidecar:
    name: browserless
    # Browserless 2.57.0 / Chrome 156 — the version Scuderia collection was verified on (2026-10-13).
    image: ghcr.io/browserless/chromium@sha256:c4fd6493ff97936eb62cb35bbc19a428dda3d30905c3a59a28d9620f29b85db1
    ports: [{containerPort: 3000}]
    env:
      - {name: CONCURRENT, value: "1"}
      # Session lifetime cap (ms); clients ask for their own with ?timeout= (parts-direct does).
      - {name: TIMEOUT, value: "64800000"}
    # The scraper container starts only once this passes.
    startupProbe:
      httpGet: {path: /active, port: 3000}
      periodSeconds: 2
      failureThreshold: 60
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      # ⚠ unverified sizing: tabs are recycled every 100 navigations now; check peak use on a full run.
      limits: {memory: 3Gi}

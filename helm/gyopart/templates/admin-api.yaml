apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: {{ include "gyopart.namespace" . }}
  labels:
    app: admin-api
    {{- include "gyopart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
        {{- include "gyopart.labels" . | nindent 8 }}
    spec:
      containers:
        - name: admin-api
          image: {{ .Values.images.adminApi }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8300
          env:
            - name: JUNKYARD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.junkyardSecret }}
                  key: JUNKYARD_USER
            - name: JUNKYARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.junkyardSecret }}
                  key: JUNKYARD_PASSWORD
            - name: JUNKYARD_DATABASE_URL
              value: "postgresql://$(JUNKYARD_USER):$(JUNKYARD_PASSWORD)@{{ .Values.postgres.host }}:5432/junkyard_inventory"
            - name: PARTS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.partsSecret }}
                  key: PARTS_USER
            - name: PARTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.partsSecret }}
                  key: PARTS_PASSWORD
            - name: PARTS_DATABASE_URL
              value: "postgresql://$(PARTS_USER):$(PARTS_PASSWORD)@{{ .Values.postgres.host }}:5432/parts_interchange"
          # TCP, not HTTP: `/` redirects to the unresolved-discrepancies page, which renders ~11 MB in ~2.7 s
          # (2026-10-14) — past the probes' 1 s timeout, so the pod was never Ready and was restarted 34
          # times in 45 h. The probes only need to know uvicorn is accepting connections.
          readinessProbe:
            tcpSocket:
              port: 8300
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 8300
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: {{ include "gyopart.namespace" . }}
  labels:
    app: admin-api
    {{- include "gyopart.labels" . | nindent 4 }}
spec:
  selector:
    app: admin-api
  ports:
    - port: 8300
      targetPort: 8300

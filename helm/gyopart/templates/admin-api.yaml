# The admin can request a yard re-scrape: Run now on the yard's ScrapeJob (scrape-job-manager's run-now
# annotation). Read + annotate ScrapeJobs in this namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-api
  namespace: {{ include "gyopart.namespace" . }}
  labels:
    {{- include "gyopart.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: admin-api
  namespace: {{ include "gyopart.namespace" . }}
  labels:
    {{- include "gyopart.labels" . | nindent 4 }}
rules:
  - apiGroups: [scrape.danwils.com]
    resources: [scrapejobs]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: admin-api
  namespace: {{ include "gyopart.namespace" . }}
  labels:
    {{- include "gyopart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: admin-api
subjects:
  - kind: ServiceAccount
    name: admin-api
    namespace: {{ include "gyopart.namespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: {{ include "gyopart.namespace" . }}
  labels:
    app: admin-api
    {{- include "gyopart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-api
  template:
    metadata:
      labels:
        app: admin-api
        {{- include "gyopart.labels" . | nindent 8 }}
    spec:
      serviceAccountName: admin-api
      containers:
        - name: admin-api
          image: {{ .Values.images.adminApi }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8300
          env:
            - name: SCRAPEJOB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.adminAuth.issuer }}
            - name: OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.adminPublicIngress.host }}
            - name: PUBLIC_URL
              value: "https://{{ . }}"
            {{- end }}
            - name: JUNKYARD_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.junkyardSecret }}
                  key: JUNKYARD_USER
            - name: JUNKYARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.junkyardSecret }}
                  key: JUNKYARD_PASSWORD
            - name: JUNKYARD_DATABASE_URL
              value: "postgresql://$(JUNKYARD_USER):$(JUNKYARD_PASSWORD)@{{ .Values.postgres.host }}:5432/junkyard_inventory"
            - name: PARTS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.partsSecret }}
                  key: PARTS_USER
            - name: PARTS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.partsSecret }}
                  key: PARTS_PASSWORD
            - name: PARTS_DATABASE_URL
              value: "postgresql://$(PARTS_USER):$(PARTS_PASSWORD)@{{ .Values.postgres.host }}:5432/parts_interchange"
          {{- with .Values.adminAuth.secret }}
          envFrom:
            # OIDC_CLIENT_ID / OIDC_CLIENT_SECRET: the authentik client, hand-applied.
            - secretRef: {name: {{ . }}}
          {{- end }}
          # /api/config: public (no sign-in), no database, instant. (The old pages took 2.7 s to render `/`,
          # which is why these were TCP until the rewrite.)
          readinessProbe:
            httpGet:
              path: /api/config
              port: 8300
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /api/config
              port: 8300
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: {{ include "gyopart.namespace" . }}
  labels:
    app: admin-api
    {{- include "gyopart.labels" . | nindent 4 }}
spec:
  selector:
    app: admin-api
  ports:
    - port: 8300
      targetPort: 8300
